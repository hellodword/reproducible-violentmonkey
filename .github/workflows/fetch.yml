name: Verify and Update

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "30 0,12 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

  update:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: release-update
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify and record latest AMO release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version_recorded="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          records = [
              json.loads(p.read_text(encoding="utf-8"))
              for p in Path("releases").glob("*.json")
          ]
          if not records:
              raise SystemExit("no recorded releases found in releases/")
          latest = max(
              records,
              key=lambda r: [int(part) for part in re.findall(r"\d+", r["version"])],
          )
          print(latest["version"])
          PY
          )"

          version_latest="$(python3 -m repro latest)"

          {
            echo "- Recorded version: \`${version_recorded}\`"
            echo "- Latest AMO version: \`${version_latest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$version_latest" = "$version_recorded" ] || [ -f "releases/${version_latest}.json" ]; then
            echo "Already up to date (${version_recorded})."
            exit 0
          fi

          python3 -m repro verify "$version_latest" --write

          {
            echo ""
            echo '```json'
            cat "releases/${version_latest}.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          branch="automated/${version_recorded}_to_${version_latest}"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B "$branch"
          git add -- "releases/${version_latest}.json"
          git commit -m "chore: [bot] ${version_recorded} -> ${version_latest}"
          git push -f origin "$branch"
          pr_url="$(gh pr create --base master --head "$branch" --fill)"
          gh pr merge "$pr_url" --delete-branch --rebase
